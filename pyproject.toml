[project]
name = "yt-video-archiver"
dynamic = ["version"]
description = "Save a YouTube video page (metadata, description, transcript, all comments) as a single offline HTML file"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Mateusz Wisłowski", email = "mateusz.wislowski@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "yt-dlp[default]>=2026.10.26",
]

# Development tools: "uv run pytest" installs them into the project's .venv
# (they are not part of the installed program). The browser tests of the
# index player need Playwright and its Chromium: "uv run --group browser
# playwright install chromium" once, then "uv run --group browser pytest --browser".
[dependency-groups]
dev = [
    "pytest>=8",
]
browser = [
    "playwright>=1.65",
]

[project.urls]
Repository = "https://github.com/mwislowski/yt-video-archiver"

# The command created by "uv tool install": yt2html -> yt2html.main()
[project.scripts]
yt2html = "yt2html:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

# The version is __version__ in yt2html.py.
[tool.hatch.version]
path = "yt2html.py"

[tool.hatch.build.targets.wheel]
only-include = ["yt2html.py", "yt2html_index.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "online: downloads real pages from YouTube (run with --online)",
    "browser: clicks pages in Chromium with Playwright (run with --browser)",
]
