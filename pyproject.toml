[project]
name = "yt-video-archiver"
dynamic = ["version"]
description = "Save a YouTube video page (metadata, description, transcript, all comments) as a single offline HTML file"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Mateusz Wisłowski", email = "mateusz.wislowski@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "yt-dlp[default]>=2026.10.26",
]

[project.urls]
Repository = "https://github.com/mwislowski/yt-video-archiver"

# The command created by "uv tool install": yt2html -> yt2html.main()
[project.scripts]
yt2html = "yt2html:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

# The version is __version__ in yt2html.py.
[tool.hatch.version]
path = "yt2html.py"

[tool.hatch.build.targets.wheel]
only-include = ["yt2html.py"]
